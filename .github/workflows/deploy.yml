name: RecruForce2 CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # Déclenche le déploiement sur chaque push sur main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # --- Build & Push Backend (Java) ---
      - name: Build Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/recruforce2-backend:latest ./recruforce2-backend
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/recruforce2-backend:latest

      # --- Build & Push AI Service (Python) ---
      - name: Build AI Service Image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/recruforce2-ai-service:latest ./recruforce2-ai-model
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/recruforce2-ai-service:latest

      # --- Build & Push Frontend (Angular) ---
      - name: Build Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/recruforce2-frontend:latest ./recruforce2-frontend
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/recruforce2-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push # Attendre que les images soient prêtes
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/html/A2/recruforce2/

            # Tirer les nouvelles images
            docker compose pull

            # Relancer les services (sans interruption si possible)
            docker compose up -d --remove-orphans

            # Nettoyer les anciennes images inutilisées
            docker image prune -f
