version: '3.8'

services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: recruforce2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - recruforce2-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MongoDB
  mongo:
    image: mongo:7
    container_name: recruforce2-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME}
    volumes:
      - mongo_data:/data/db
    networks:
      - recruforce2-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend
  backend:
    build: .
    image: ${DOCKER_HUB_USER:-moustapha}/recruforce2-backend:latest
    container_name: recruforce2-backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://recruforce2-postgres:5432/${DB_NAME}
      DATABASE_USER: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      MONGODB_URI: mongodb://recruforce2-mongo:27017/${DB_NAME}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    networks:
      - recruforce2-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # AI Service
  ai-service:
    build: ../recruforce2-ai-model
    image: ${DOCKER_HUB_USER:-moustapha}/recruforce2-ai-service:latest
    container_name: recruforce2-ai-service
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      MONGODB_URI: mongodb://recruforce2-mongo:27017/${DB_NAME}
      MONGODB_HOST: recruforce2-mongo
      MONGODB_DATABASE: ${DB_NAME}
      BACKEND_API_URL: ${BACKEND_URL}
      BACKEND_API_EMAIL: ${AI_SERVICE_EMAIL}
      BACKEND_API_PASSWORD: ${AI_SERVICE_PASSWORD}
    volumes:
      - ai_models:/app/persistence/trained_models
    ports:
      - "8000:8000"
    networks:
      - recruforce2-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # N8N
  n8n:
    image: n8nio/n8n:latest
    container_name: recruforce2-n8n
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=recruforce2-postgres
      - DB_POSTGRESDB_DATABASE=${DB_NAME}
      - DB_POSTGRESDB_USER=${DB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD}
      - N8N_AUTH_ENABLED=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - WEBHOOK_URL=http://localhost:5678/
      - BACKEND_API_URL=${BACKEND_URL}
      - BACKEND_API_TOKEN=${BACKEND_API_TOKEN}
      - AI_SERVICE_URL=${AI_SERVICE_URL}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - recruforce2-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend
  frontend:
    build: ../recruforce2-frontend
    image: ${DOCKER_HUB_USER:-moustapha}/recruforce2-frontend:latest
    container_name: recruforce2-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    environment:
      API_URL: ${BACKEND_URL}
    networks:
      - recruforce2-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  mongo_data:
  ai_models:
  n8n_data:

networks:
  recruforce2-network:
    driver: bridge
