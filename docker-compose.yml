version: '3.8'

services:
  # ===================================================
  # PostgreSQL - Backend + N8N Database
  # ===================================================
  postgres:
    image: postgres:15-alpine
    container_name: recruforce2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recruforce2_prod
      POSTGRES_USER: recruforce2_user
      POSTGRES_PASSWORD: recruforce2_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - recruforce2-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruforce2_user -d recruforce2_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================
  # MongoDB - AI Service Database
  # ===================================================
  mongo:
    image: mongo:7
    container_name: recruforce2-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: recruforce2_prod
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - recruforce2-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================
  # Backend - Spring Boot Application
  # ===================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruforce2-backend
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/recruforce2_prod
      DATABASE_USER: recruforce2_user
      DATABASE_PASSWORD: recruforce2_pass
      MONGODB_URI: mongodb://mongo:27017/recruforce2_prod
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-production-secret-key-change-me-minimum-256-bits-required}
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://frontend:80
    ports:
      - "8080:8080"
    networks:
      - recruforce2-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================================================
  # AI Service - FastAPI
  # ===================================================
  ai-service:
    build:
      context: ../recruforce2-ai-model
      dockerfile: Dockerfile
    container_name: recruforce2-ai-service
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/recruforce2_prod
      MONGODB_HOST: mongo
      MONGODB_PORT: 27017
      MONGODB_DATABASE: recruforce2_prod
      BACKEND_API_URL: http://backend:8080
      BACKEND_API_EMAIL: ai-service@recruforce2.internal
      BACKEND_API_PASSWORD: AiService@Internal2024!
    volumes:
      - ai_models:/app/persistence/trained_models
    ports:
      - "8000:8000"
    networks:
      - recruforce2-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================================================
  # Frontend - Angular/Nginx
  # ===================================================
  frontend:
    build:
      context: ../recruforce2-frontend
      dockerfile: Dockerfile
    container_name: recruforce2-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - recruforce2-network
    environment:
      API_URL: http://backend:8080

  # ===================================================
  # N8N - Workflow Automation
  # ===================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: recruforce2-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: recruforce2_user
      DB_POSTGRESDB_PASSWORD: recruforce2_pass
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-admin123}
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Europe/Paris
      # Variables pour les workflows
      AI_SERVICE_URL: http://ai-service:8000
      BACKEND_API_URL: http://backend:8080
      SMTP_FROM: noreply@recruforce2.com
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../recruforce2-workflows/workflows:/workflows:ro
    networks:
      - recruforce2-network

# ===================================================
# Volumes
# ===================================================
volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
  ai_models:
    driver: local
  n8n_data:
    external: true
    name: recruforce2_n8n_data

# ===================================================
# Networks
# ===================================================
networks:
  recruforce2-network:
    driver: bridge
