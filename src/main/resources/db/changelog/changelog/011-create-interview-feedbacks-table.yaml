databaseChangeLog:
  - changeSet:
      id: 011-create-interview-feedbacks-table
      author: recruforce2
      comment: "Creates feedbacks, criteria, and evaluation_criteria tables for interview scoring"
      changes:

        # -------------------------------------------------------
        # Criteria table — reusable evaluation criteria per interview type
        # -------------------------------------------------------
        - createTable:
            tableName: criteria
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: interview_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: weight
                  type: INTEGER
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_criteria_interview_type
            tableName: criteria
            columns:
              - column:
                  name: interview_type

        # -------------------------------------------------------
        # Feedbacks table — overall interview evaluation
        # -------------------------------------------------------
        - createTable:
            tableName: feedbacks
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: interview_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_feedbacks_interview
                    references: interviews(id)
              - column:
                  name: evaluator_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_feedbacks_evaluator
                    references: users(id)
              - column:
                  name: overall_score
                  type: INTEGER
              - column:
                  name: general_comment
                  type: TEXT
              - column:
                  name: recommendation
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_feedbacks_interview_id
            tableName: feedbacks
            columns:
              - column:
                  name: interview_id

        - createIndex:
            indexName: idx_feedbacks_evaluator_id
            tableName: feedbacks
            columns:
              - column:
                  name: evaluator_id

        # -------------------------------------------------------
        # Evaluation criteria table — per-criterion scores within a feedback
        # -------------------------------------------------------
        - createTable:
            tableName: evaluation_criteria
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: feedback_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_eval_criteria_feedback
                    references: feedbacks(id)
              - column:
                  name: criterion_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_eval_criteria_criterion
                    references: criteria(id)
              - column:
                  name: score
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: comment
                  type: TEXT

        - createIndex:
            indexName: idx_eval_criteria_feedback_id
            tableName: evaluation_criteria
            columns:
              - column:
                  name: feedback_id

        - createIndex:
            indexName: idx_eval_criteria_criterion_id
            tableName: evaluation_criteria
            columns:
              - column:
                  name: criterion_id
