databaseChangeLog:
  - changeSet:
      id: 015-add-new-indexes
      author: recruforce2
      comment: "Adds additional performance indexes for interview, feedback, prediction and notification queries"
      changes:
        - createIndex:
            indexName: idx_interviews_type_status
            tableName: interviews
            columns:
              - column: { name: type }
              - column: { name: status }

        - createIndex:
            indexName: idx_interviews_upcoming
            tableName: interviews
            columns:
              - column: { name: date_time }
              - column: { name: status }

        - createIndex:
            indexName: idx_feedbacks_overall_score
            tableName: feedbacks
            columns:
              - column: { name: overall_score }

        - createIndex:
            indexName: idx_predictions_matching_score
            tableName: predictions
            columns:
              - column: { name: matching_score }

        - createIndex:
            indexName: idx_predictions_ml_model_id
            tableName: predictions
            columns:
              - column: { name: ml_model_id }

        - createIndex:
            indexName: idx_notifications_unread
            tableName: notifications
            columns:
              - column: { name: recipient_id }
              - column: { name: is_read }

        - createIndex:
            indexName: idx_audit_action
            tableName: audit_logs
            columns:
              - column: { name: action }

        - createIndex:
            indexName: idx_availability_user_available
            tableName: availabilities
            columns:
              - column: { name: user_id }
              - column: { name: is_available }
              - column: { name: start_date_time }

        - createIndex:
            indexName: idx_ml_models_active_version
            tableName: ml_models
            columns:
              - column: { name: is_active }
              - column: { name: version }
