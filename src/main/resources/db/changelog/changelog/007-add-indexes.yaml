databaseChangeLog:
  - changeSet:
      id: 007-add-indexes
      author: recruforce2
      changes:
        - createIndex:
            indexName: idx_users_role
            tableName: users
            columns:
              - column:
                  name: role
        - createIndex:
            indexName: idx_job_offers_status
            tableName: job_offers
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_app_candidate_status
            tableName: applications
            columns:
              - column:
                  name: candidate_id
              - column:
                  name: status
        - createIndex:
            indexName: idx_candidate_user_id
            tableName: candidate_profiles
            columns:
              - column:
                  name: user_id
