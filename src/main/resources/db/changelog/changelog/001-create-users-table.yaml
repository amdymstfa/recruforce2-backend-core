databaseChangeLog:
  - changeSet:
      id: 001-create-users-table
      author: recruforce2
      changes:
        - createTable:
            tableName: users
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true, nullable: false } }
              - column: { name: email, type: VARCHAR(150), constraints: { nullable: false, unique: true } }
              - column: { name: password, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: first_name, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: last_name, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: phone, type: VARCHAR(20) }
              - column: { name: role, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: is_active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP }
        - createIndex:
            indexName: idx_users_email
            tableName: users
            unique: true
            columns:
              - column: { name: email }
