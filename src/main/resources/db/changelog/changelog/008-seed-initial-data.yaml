databaseChangeLog:
  - changeSet:
      id: 008-seed-initial-data
      author: recruforce2
      comment: "Seeds initial data — default admin user and base skill repository"
      changes:

        # -------------------------------------------------------
        # Default admin user
        # Password: Admin@recruforce2! (BCrypt hashed, strength 12)
        # IMPORTANT: Change this password immediately after first login
        # -------------------------------------------------------
        - insert:
            tableName: users
            columns:
              - column:
                  name: email
                  value: admin@recruforce2.com
              - column:
                  name: password
                  value: "$2a$12$LcFZ9SIc3m5JO7dWZCYyIOsHUDsBBHpMriZboBMeTl8wP3qGwI.Ey"
              - column:
                  name: first_name
                  value: Admin
              - column:
                  name: last_name
                  value: RecruForce2
              - column:
                  name: role
                  value: ADMIN
              - column:
                  name: is_active
                  valueBoolean: true
              - column:
                  name: created_at
                  valueDate: now()
              - column:
                  name: updated_at
                  valueDate: now()

        # -------------------------------------------------------
        # Default notification preferences for admin
        # -------------------------------------------------------
        - insert:
            tableName: notification_preferences
            columns:
              - column:
                  name: user_id
                  valueComputed: "(SELECT id FROM users WHERE email = 'admin@recruforce2.com')"
              - column:
                  name: email_new_candidate
                  valueBoolean: true
              - column:
                  name: email_interview
                  valueBoolean: true
              - column:
                  name: email_deadline
                  valueBoolean: true
              - column:
                  name: in_app_notifications
                  valueBoolean: true

        # -------------------------------------------------------
        # Base skill repository — Technical skills
        # -------------------------------------------------------
        - insert:
            tableName: skills
            columns:
              - column: { name: name, value: "Java" }
              - column: { name: type, value: "TECHNICAL" }
              - column: { name: required_level, value: "INTERMEDIATE" }
        - insert:
            tableName: skills
            columns:
              - column: { name: name, value: "Spring Boot" }
              - column: { name: type, value: "TECHNICAL" }
              - column: { name: required_level, value: "INTERMEDIATE" }
        - insert:
            tableName: skills
