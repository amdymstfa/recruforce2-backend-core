databaseChangeLog:
  - changeSet:
      id: 010-create-interview-slots-table
      author: recruforce2
      comment: "Creates the availabilities table — manages recruiter/manager time slot availability"
      changes:
        - createTable:
            tableName: availabilities
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_availability_user
                    references: users(id)
              - column:
                  name: start_date_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: end_date_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: is_recurring
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: day_of_week
                  type: VARCHAR(15)
              - column:
                  name: is_available
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_availability_user_id
            tableName: availabilities
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_availability_day
            tableName: availabilities
            columns:
              - column:
                  name: day_of_week

        - createIndex:
            indexName: idx_availability_slot
            tableName: availabilities
            columns:
              - column:
                  name: start_date_time
              - column:
                  name: is_available
