databaseChangeLog:
  - changeSet:
      id: 013-create-notifications-table
      author: recruforce2
      comment: "Creates the notifications table — in-app and email alerts for all user types"
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: recipient_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_notifications_recipient
                    references: users(id)
              - column:
                  name: type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: TEXT
              - column:
                  name: link
                  type: VARCHAR(500)
              - column:
                  name: is_read
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: read_at
                  type: TIMESTAMP

        - createIndex:
            indexName: idx_notifications_recipient_id
            tableName: notifications
            columns:
              - column:
                  name: recipient_id

        - createIndex:
            indexName: idx_notifications_is_read
            tableName: notifications
            columns:
              - column:
                  name: is_read

        - createIndex:
            indexName: idx_notifications_created_at
            tableName: notifications
            columns:
              - column:
                  name: created_at
