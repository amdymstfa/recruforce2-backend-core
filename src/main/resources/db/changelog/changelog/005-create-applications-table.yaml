databaseChangeLog:
  - changeSet:
      id: 005-create-applications-table
      author: recruforce2
      changes:
        - createTable:
            tableName: applications
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true, nullable: false } }
              - column: { name: candidate_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_app_candidate, references: "candidate_profiles(id)" } }
              - column: { name: job_offer_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_app_job, references: "job_offers(id)" } }
              - column: { name: received_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(30), defaultValue: RECEIVED, constraints: { nullable: false } }
              - column: { name: matching_score, type: INTEGER }
              - column: { name: cover_letter, type: TEXT }
              - column: { name: cv_file_path, type: VARCHAR(255) }
              - column: { name: is_qualified, type: BOOLEAN, defaultValue: false }
              - column: { name: source_channel, type: VARCHAR(50) }
