databaseChangeLog:
  - changeSet:
      id: 012-create-audit-logs-table
      author: recruforce2
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: action, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: entity_type, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: entity_id, type: BIGINT }
              - column: { name: details, type: TEXT }
              - column: { name: ip_address, type: VARCHAR(45) }
              - column: { name: timestamp, type: TIMESTAMP, constraints: { nullable: false } }

        - addForeignKeyConstraint:
            baseTableName: audit_logs
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_audit_logs_user

        - createIndex:
            indexName: idx_audit_user_id
            tableName: audit_logs
            columns:
              - column: { name: user_id }

        - createIndex:
            indexName: idx_audit_entity
            tableName: audit_logs
            columns:
              - column: { name: entity_type }
              - column: { name: entity_id }

        - createIndex:
            indexName: idx_audit_timestamp
            tableName: audit_logs
            columns:
              - column: { name: timestamp }
