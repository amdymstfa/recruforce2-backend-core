# db/changelog/changelog/003b-create-candidate-skills-table.yaml
databaseChangeLog:
  - changeSet:
      id: 003b-create-candidate-skills-table
      author: recruforce2
      changes:
        - createTable:
            tableName: candidate_skills
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: candidate_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: skill_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: mastery_level
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: years_experience
                  type: INT

        - addForeignKeyConstraint:
            baseTableName: candidate_skills
            baseColumnNames: candidate_id
            referencedTableName: candidate_profiles
            referencedColumnNames: id
            constraintName: fk_candidate_skills_candidate

        - addForeignKeyConstraint:
            baseTableName: candidate_skills
            baseColumnNames: skill_id
            referencedTableName: skills
            referencedColumnNames: id
            constraintName: fk_candidate_skills_skill

        - createIndex:
            indexName: idx_candidate_skills_candidate_id
            tableName: candidate_skills
            columns:
              - column:
                  name: candidate_id

        - createIndex:
            indexName: idx_candidate_skills_skill_id
            tableName: candidate_skills
            columns:
              - column:
                  name: skill_id
