databaseChangeLog:
  - changeSet:
      id: 009-create-interviews-table
      author: recruforce2
      comment: "Creates the interviews table — supports Soft Skills (Phase 1) and Hard Skills (Phase 2)"
      changes:
        - createTable:
            tableName: interviews
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: application_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_interviews_application
                    references: applications(id)
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(25)
                  defaultValue: SCHEDULED
                  constraints:
                    nullable: false
              - column:
                  name: date_time
                  type: TIMESTAMP
              - column:
                  name: duration_minutes
                  type: INTEGER
                  defaultValueNumeric: 60
              - column:
                  name: location
                  type: VARCHAR(250)
              - column:
                  name: video_link
                  type: VARCHAR(500)
              - column:
                  name: interviewer_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_interviews_interviewer
                    references: users(id)
              - column:
                  name: invitation_token
                  type: VARCHAR(100)
                  constraints:
                    unique: true
              - column:
                  name: confirmation_date
                  type: TIMESTAMP

        - createIndex:
            indexName: idx_interviews_application_id
            tableName: interviews
            columns:
              - column:
                  name: application_id

        - createIndex:
            indexName: idx_interviews_interviewer_id
            tableName: interviews
            columns:
              - column:
                  name: interviewer_id

        - createIndex:
            indexName: idx_interviews_status
            tableName: interviews
            columns:
              - column:
                  name: status

        - createIndex:
            indexName: idx_interviews_date
            tableName: interviews
            columns:
              - column:
                  name: date_time
