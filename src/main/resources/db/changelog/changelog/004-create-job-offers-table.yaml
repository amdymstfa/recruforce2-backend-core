databaseChangeLog:
  - changeSet:
      id: 004-create-job-offers-table
      author: recruforce2
      changes:
        - createTable:
            tableName: job_offers
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true, nullable: false } }
              - column: { name: title, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: description, type: TEXT, constraints: { nullable: false } }
              - column: { name: location, type: VARCHAR(200) }
              - column: { name: contract_type, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(20), defaultValue: DRAFT, constraints: { nullable: false } }
              - column: { name: created_by, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_job_offers_user, references: "users(id)" } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP }
        - createTable:
            tableName: job_offer_skills
            columns:
              - column: { name: job_offer_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_jos_offer, references: "job_offers(id)" } }
              - column: { name: skill_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_jos_skill, references: "skills(id)" } }
        - addPrimaryKey:
            tableName: job_offer_skills
            columnNames: job_offer_id, skill_id
