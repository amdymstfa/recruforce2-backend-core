# ===================================================
# RecruForce2 - Main Configuration
# Common settings shared across all profiles
# ===================================================

spring:
  application:
    name: recruforce2

  # ===================================================
  # Jackson JSON serialization
  # ===================================================
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
    default-property-inclusion: non_null

  # ===================================================
  # Liquibase database migrations
  # ===================================================
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    drop-first: false

  # ===================================================
  # JPA / Hibernate
  # ===================================================
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false

  # ===================================================
  # Email configuration (SMTP)
  # ===================================================
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

  # ===================================================
  # Servlet / Multipart file upload
  # ===================================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

# ===================================================
# Server configuration
# ===================================================
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  error:
    include-message: always
    include-stacktrace: never

# ===================================================
# JWT configuration
# ===================================================
jwt:
  secret: ${JWT_SECRET:recruforce2-secret-key-change-this-in-production-minimum-256-bits}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds

# ===================================================
# AI Microservice configuration
# ===================================================
ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout: ${AI_SERVICE_TIMEOUT:30000} # 30 seconds
    endpoints:
      parse-cv: /api/parse-cv
      match-score: /api/match-score
      predict: /api/predict

# ===================================================
# N8N Workflow configuration
# ===================================================
n8n:
  webhook:
    url: ${N8N_WEBHOOK_URL:http://localhost:5678/webhook}

# ===================================================
# Application-specific settings
# ===================================================
recruforce:
  matching:
    threshold: ${MATCHING_THRESHOLD:60} # Minimum score to be qualified (0-100)

  pagination:
    default-page-size: 20
    max-page-size: 100

  file-storage:
    cv-upload-dir: ${CV_UPLOAD_DIR:./uploads/cvs}
    allowed-extensions: pdf,docx,doc

# ===================================================
# Actuator / Monitoring (optional)
# ===================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ===================================================
# Logging
# ===================================================
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  level:
    root: INFO
    com.backend_core.recruforce2: INFO
