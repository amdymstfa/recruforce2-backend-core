# ===================================================
# RecruForce2 - Development Profile
# Active with: --spring.profiles.active=dev
# ===================================================

spring:
  # ===================================================
  # PostgreSQL database connection
  # ===================================================
  datasource:
    url: jdbc:postgresql://localhost:5432/recruforce2_dev
    username: recruforce2_user
    password: recruforce2_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000

  # ===================================================
  # JPA / Hibernate
  # ===================================================
  jpa:
    hibernate:
      ddl-auto: validate # Liquibase handles schema changes
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ===================================================
  # MongoDB connection
  # ===================================================
  data:
    mongodb:
      host: localhost
      port: 27017
      database: recruforce2_dev
      auto-index-creation: true

  # ===================================================
  # Liquibase
  # ===================================================
  liquibase:
    enabled: true
    drop-first: false
    contexts: dev

  # ===================================================
  # DevTools (hot reload)
  # ===================================================
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# ===================================================
# Server configuration
# ===================================================
server:
  port: 8080
  error:
    include-stacktrace: on_param # Show stacktrace with ?trace=true

# ===================================================
# Logging
# ===================================================
logging:
  level:
    root: INFO
    com.backend_core.recruforce2: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.springframework.web: DEBUG
    org.mongodb.driver: DEBUG

# ===================================================
# CORS (allow Angular dev server)
# ===================================================
cors:
  allowed-origins: http://localhost:4200,http://localhost:4201
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# ===================================================
# AI Microservice
# ===================================================
ai:
  service:
    url: http://localhost:8000
