# ===================================================
# RecruForce2 - Production Profile
# Active with: --spring.profiles.active=prod
# ===================================================

spring:
  # ===================================================
  # PostgreSQL database connection
  # ===================================================
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://db:5432/recruforce2_prod}
    username: ${DATABASE_USER:recruforce2_user}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ===================================================
  # JPA / Hibernate
  # ===================================================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ===================================================
  # MongoDB connection
  # ===================================================
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongo:27017/recruforce2_prod}
      auto-index-creation: true

  # ===================================================
  # Liquibase
  # ===================================================
  liquibase:
    enabled: false
    drop-first: false
    contexts: prod

# ===================================================
# Server configuration
# ===================================================
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  error:
    include-stacktrace: never
    include-message: always
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}

# ===================================================
# Logging
# ===================================================
logging:
  level:
    root: WARN
    com.backend_core.recruforce2: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  file:
    name: /var/log/recruforce2/application.log
    max-size: 10MB
    max-history: 30

# ===================================================
# CORS (production frontend URL)
# ===================================================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://recruforce2.com,https://www.recruforce2.com}
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# ===================================================
# AI Microservice
# ===================================================
ai:
  service:
    url: ${AI_SERVICE_URL:http://ai-service:8000}
    timeout: 30000

# ===================================================
# AI/Matching Configuration
# ===================================================
matching:
  threshold: ${MATCHING_THRESHOLD:60}

# ===================================================
# Security headers
# ===================================================
security:
  headers:
    content-security-policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
    strict-transport-security: "max-age=31536000; includeSubDomains"

# ===================================================
# Actuator / Monitoring (optional)
# ===================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

